<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Последний Бастион</title>
  <meta name="description" content="2.5D защита замка: отстройте поселение и переживите 25 волн зомби.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="stage-wrap">
      <div id="stage">
        <canvas id="game"></canvas>

        <div id="hud">
          <div class="hud-group">
            <div class="pill gold" id="goldPill" title="Золото"><span class="ico">🪙</span><span id="gold">0</span></div>
            <div class="pill" title="Волна">Волна <b id="wave">1</b><span class="dim">/25</span></div>
            <div class="pill" title="Осталось зомби">🧟 <span id="enemies">—</span></div>
          </div>
          <div class="wallbar" title="Прочность стены">
            <span class="wl">🧱</span>
            <div class="bar"><div id="wallFill"></div><span id="wallText"></span></div>
          </div>
          <div class="hud-group">
            <button id="btnSpeed" class="btn small" title="Скорость">x1</button>
            <button id="btnPause" class="btn small" title="Пауза (P)">⏸</button>
            <button id="btnSound" class="btn small" title="Звук">🔊</button>
            <button id="btnMenu" class="btn small" title="Меню">☰</button>
          </div>
        </div>

        <div id="prep" class="hidden">
          <div class="prep-title">Подготовка к волне <b id="prepWave"></b></div>
          <div class="prep-info" id="prepInfo"></div>
          <div class="prep-row">
            <button id="btnStart" class="btn primary">⚔ В бой!</button>
            <label class="auto"><input type="checkbox" id="chkAuto"> Автостарт <span id="prepTimer"></span></label>
          </div>
        </div>

        <div id="toast"></div>
        <div id="overlay" class="hidden"><div class="modal" id="modal"></div></div>
      </div>
    </main>

    <aside id="panel">
      <div class="tabs">
        <button class="tab active" data-tab="building">🏘 Поселение <span class="badge"></span></button>
        <button class="tab" data-tab="defense">🛡 Оборона <span class="badge"></span></button>
      </div>
      <div id="cards"></div>
      <div class="panel-foot">Клик по зданию на карте откроет его улучшения</div>
    </aside>
  </div>

  <script src="js/config.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
